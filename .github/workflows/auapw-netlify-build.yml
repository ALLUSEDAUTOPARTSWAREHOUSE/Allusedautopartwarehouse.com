name: AUAPW Netlify Build Verification

on:
  push:
    branches:
      - main
      - "feat/auapw-ai-operations-center"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: auapw-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install, test, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build Next.js application
        run: pnpm build
        env:
          # Build-only placeholders; no production secrets or live services are accessed.
          BETTER_AUTH_SECRET: build-only-placeholder-secret-at-least-32-chars
          DATABASE_URL: postgres://build:build@127.0.0.1:5432/build
          ADMIN_PASSWORD: build-only-placeholder-password
          NEXT_TELEMETRY_DISABLED: "1"
